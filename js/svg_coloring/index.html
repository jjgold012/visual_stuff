<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SVG Live Color Editor</title>
  <script src="https://unpkg.com/chroma-js@2.4.2/chroma.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 2em;
    }

    #svg-container {
      border: 1px solid #ccc;
      min-height: 400px;
      margin-top: 1em;
    }

    .color-picker {
      margin: 0.5em 0;
    }

    .controls {
      margin-bottom: 1em;
    }

    #palette-bar {
      display: flex;
      gap: 2px;
      margin-bottom: 1em;
      height: 32px;
    }

    .swatch {
      flex: 1 1 0;
      height: 100%;
    }
  </style>
</head>

<body>
  <h2>SVG Live Color Editor</h2>
  <div class="controls">
    <input type="file" id="svgFile" accept=".svg">
    <button id="downloadBtn" disabled>Download SVG</button>
    <br>
    <button id="applyBtn" disabled>Apply Colors</button>
    <br>
    <label>Color mode:
      <select id="colorMode">
        <option value="horizontal">Horizontal</option>
        <option value="vertical">Vertical</option>
        <option value="radial">Radial</option>
      </select>
    </label>
    <label style="margin-left:1em;">Randomness:
      <input type="range" id="randomness" min="0" max="1" step="0.01" value="1" style="vertical-align:middle;width:120px;">
      <span id="randomnessValue">1.00</span>
    </label>
    <label style="margin-left:1em;">Colormap:
      <select id="colormap">
        <option value="custom">Custom</option>
        <option value="viridis">Viridis</option>
        <option value="inferno">Inferno</option>
        <option value="magma">Magma</option>
        <option value="plasma">Plasma</option>
        <option value="cividis">Cividis</option>
      </select>
    </label>
    <span id="customColors">
      <label>Pick color 1: <input type="color" id="color1" class="color-picker" value="#ff0000"></label>
      <label>Pick color 2: <input type="color" id="color2" class="color-picker" value="#00ff00"></label>
      <label>Pick color 3: <input type="color" id="color3" class="color-picker" value="#0000ff"></label>
    </span>
  </div>
  <div id="palette-bar"></div>
  <div id="svg-container"></div>
  <script>
    let svgDoc = null;

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
      const num = parseInt(hex, 16);
      return [num >> 16 & 255, num >> 8 & 255, num & 255];
    }
    function rgbToHex([r, g, b]) {
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    function lerpColor(c1, c2, t) {
      const rgb1 = hexToRgb(c1);
      const rgb2 = hexToRgb(c2);
      return rgbToHex([
        Math.round(lerp(rgb1[0], rgb2[0], t)),
        Math.round(lerp(rgb1[1], rgb2[1], t)),
        Math.round(lerp(rgb1[2], rgb2[2], t))
      ]);
    }
    // Convert RGB [0-255,0-255,0-255] to CMYK [0-1,0-1,0-1,0-1]
    function rgbToCmyk([r, g, b]) {
      r /= 255; g /= 255; b /= 255;
      const k = 1 - Math.max(r, g, b);
      if (k === 1) return [0, 0, 0, 1];
      const c = (1 - r - k) / (1 - k);
      const m = (1 - g - k) / (1 - k);
      const y = (1 - b - k) / (1 - k);
      return [c, m, y, k];
    }
    // Convert CMYK [0-1,0-1,0-1,0-1] to RGB [0-255,0-255,0-255]
    function cmykToRgb([c, m, y, k]) {
      const r = 255 * (1 - c) * (1 - k);
      const g = 255 * (1 - m) * (1 - k);
      const b = 255 * (1 - y) * (1 - k);
      return [Math.round(r), Math.round(g), Math.round(b)];
    }
    // Interpolate between two hex colors in CMYK space
    function lerpColorCMYK(hex1, hex2, t) {
      const rgb1 = hexToRgb(hex1);
      const rgb2 = hexToRgb(hex2);
      const cmyk1 = rgbToCmyk(rgb1);
      const cmyk2 = rgbToCmyk(rgb2);
      const cmyk = cmyk1.map((v, i) => lerp(v, cmyk2[i], t));
      return rgbToHex(cmykToRgb(cmyk));
    }

    function getPolygonCentroid(points) {
      return points.reduce((sum, p) => sum + p[1], 0) / points.length;
    }
    function getPathCentroid(pathElem) {
      // Try to use getBBox if available
      if (typeof pathElem.getBBox === 'function') {
        try {
          const bbox = pathElem.getBBox();
          return bbox.y + bbox.height / 2;
        } catch (e) { }
      }
      // Fallback: try to parse M/m/L/l commands
      const d = pathElem.getAttribute('d');
      if (!d) return 0;
      const matches = [...d.matchAll(/[MLml]\s*([\d.-]+)[, ]+([\d.-]+)/g)];
      if (matches.length === 0) return 0;
      const ys = matches.map(m => parseFloat(m[2]));
      return ys.reduce((a, b) => a + b, 0) / ys.length;
    }
    function getPolygonCentroidXY(points) {
      const cx = points.reduce((sum, p) => sum + p[0], 0) / points.length;
      const cy = points.reduce((sum, p) => sum + p[1], 0) / points.length;
      return [cx, cy];
    }
    function getPathCentroidXY(pathElem) {
      if (typeof pathElem.getBBox === 'function') {
        try {
          const bbox = pathElem.getBBox();
          return [bbox.x + bbox.width / 2, bbox.y + bbox.height / 2];
        } catch (e) { }
      }
      const d = pathElem.getAttribute('d');
      if (!d) return [0, 0];
      const matches = [...d.matchAll(/[MLml]\s*([\d.-]+)[, ]+([\d.-]+)/g)];
      if (matches.length === 0) return [0, 0];
      const xs = matches.map(m => parseFloat(m[1]));
      const ys = matches.map(m => parseFloat(m[2]));
      return [
        xs.reduce((a, b) => a + b, 0) / xs.length,
        ys.reduce((a, b) => a + b, 0) / ys.length
      ];
    }

    // Colormap using chroma.js
    function getColormapColor(map, t) {
      // t in [0,1]
      let scale;
      if (chroma.brewer[map]) {
        scale = chroma.scale(map);
      } else {
        scale = chroma.scale(['#000', '#fff']);
      }
      return scale(clamp(t)).hex();
    }
    function clamp(x) { return Math.max(0, Math.min(1, x)); }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    function lerpColor(c1, c2, t) {
      const rgb1 = hexToRgb(c1);
      const rgb2 = hexToRgb(c2);
      return rgbToHex([
        Math.round(lerp(rgb1[0], rgb2[0], t)),
        Math.round(lerp(rgb1[1], rgb2[1], t)),
        Math.round(lerp(rgb1[2], rgb2[2], t))
      ]);
    }
    function getPalette() {
      const colormap = document.getElementById('colormap').value;
      if (colormap === 'custom') {
        const c1 = document.getElementById('color1').value;
        const c2 = document.getElementById('color2').value;
        const c3 = document.getElementById('color3').value;
        return [
          c1,
          lerpColor(c1, c2, 0.5),
          c2,
          lerpColor(c2, c3, 0.5),
          c3
        ];
      } else {
        // Generate 5 colors from colormap
        return [0, 0.25, 0.5, 0.75, 1].map(t => getColormapColor(colormap, t));
      }
    }

    function getPolygonCentroid(points) {
      return points.reduce((sum, p) => sum + p[1], 0) / points.length;
    }
    function getPathCentroid(pathElem) {
      // Try to use getBBox if available
      if (typeof pathElem.getBBox === 'function') {
        try {
          const bbox = pathElem.getBBox();
          return bbox.y + bbox.height / 2;
        } catch (e) { }
      }
      // Fallback: try to parse M/m/L/l commands
      const d = pathElem.getAttribute('d');
      if (!d) return 0;
      const matches = [...d.matchAll(/[MLml]\s*([\d.-]+)[, ]+([\d.-]+)/g)];
      if (matches.length === 0) return 0;
      const ys = matches.map(m => parseFloat(m[2]));
      return ys.reduce((a, b) => a + b, 0) / ys.length;
    }
    function getPolygonCentroidXY(points) {
      const cx = points.reduce((sum, p) => sum + p[0], 0) / points.length;
      const cy = points.reduce((sum, p) => sum + p[1], 0) / points.length;
      return [cx, cy];
    }
    function getPathCentroidXY(pathElem) {
      if (typeof pathElem.getBBox === 'function') {
        try {
          const bbox = pathElem.getBBox();
          return [bbox.x + bbox.width / 2, bbox.y + bbox.height / 2];
        } catch (e) { }
      }
      const d = pathElem.getAttribute('d');
      if (!d) return [0, 0];
      const matches = [...d.matchAll(/[MLml]\s*([\d.-]+)[, ]+([\d.-]+)/g)];
      if (matches.length === 0) return [0, 0];
      const xs = matches.map(m => parseFloat(m[1]));
      const ys = matches.map(m => parseFloat(m[2]));
      return [
        xs.reduce((a, b) => a + b, 0) / xs.length,
        ys.reduce((a, b) => a + b, 0) / ys.length
      ];
    }

    function updateSVGColors() {
      if (!svgDoc) return;
      const colormap = document.getElementById('colormap').value;
      const palette = getPalette(); // Only used for custom
      const polygons = Array.from(svgDoc.querySelectorAll('polygon'));
      const paths = Array.from(svgDoc.querySelectorAll('path'));
      const allShapes = polygons.concat(paths);
      if (allShapes.length === 0) return;
      const colorMode = document.getElementById('colorMode').value;
      let minVal = Infinity, maxVal = -Infinity;
      let cx = 0, cy = 0;
      let tx = 0, ty = 0;
      let vb = svgDoc.getAttribute('viewBox');
      let g = svgDoc.querySelector('g');
      if (g) {
        let g_transform = g.getAttribute('transform');
        if (g_transform) {
          const match = g_transform.match(/translate\(\s*([\-\d.]+)\s*,\s*([\-\d.]+)\s*\)/);
          if (match) {
            tx = parseFloat(match[1]);
            ty = parseFloat(match[2]);
          }
        }
      }
      const [x, y, w, h] = vb.split(/\s+/).map(Number);
      cx = w/2 + x;
      cy = h/2 + y;
      if (colorMode === 'horizontal') {
        minVal = x;
        maxVal = x+w;
      } else if (colorMode === 'vertical') {
        minVal = y;
        maxVal = y+h;
      } else if (colorMode === 'radial') {
        minVal = 0;
        maxVal = Math.max(cx, cy);
      }
      const randomness = parseFloat(document.getElementById('randomness').value);
      allShapes.forEach(shape => {
        
        if (shape.getAttribute('fill') == "rgb(255,255,255)") return;
        let cxy = [0, 0];
        if (shape.tagName === 'polygon') {
          const points = shape.getAttribute('points').trim().split(/\s+/)
            .map(pt => pt.split(',').map(Number));
          cxy = getPolygonCentroidXY(points);
        } else if (shape.tagName === 'path') {
          cxy = getPathCentroidXY(shape);
        }
        if (shape.getAttribute('transform')) {
          const transform = shape.getAttribute('transform');
          const match = transform.match(/translate\(\s*([\-\d.]+)\s*,\s*([\-\d.]+)\s*\)/);
          if (match) {
            cxy[0] += parseFloat(match[1]);
            cxy[1] += parseFloat(match[2]);
          }
        }
        let v = 0;
        if (colorMode === 'horizontal') {
          v = cxy[0] + tx;
        } else if (colorMode === 'vertical') {
          v = cxy[1] + ty;
        } else if (colorMode === 'radial') {
          v = Math.sqrt((cxy[0] - cx) ** 2 + (cxy[1] - cy) ** 2);
        }
        const t = (v - minVal) / (maxVal - minVal);
        let color;
        if (colormap === 'custom') {
          const idx = t * (palette.length - 1);
          const i = Math.min(Math.floor(idx), palette.length - 1);
          const j = Math.min(i + 1, palette.length - 1);
          const frac = idx - i;
          const pickFrac = frac * randomness;
          color = Math.random() < pickFrac ? palette[j] : palette[i];
        } else {
          // For colormap, pick color from colormap at t, with randomness controlling spread
          let t2 = t + (Math.random() - 0.5) * randomness;
          t2 = Math.max(0, Math.min(1, t2));
          color = getColormapColor(colormap, t2);
        }
        const opacity = 1 + (Math.random() - 0.5) * randomness;
        shape.setAttribute('fill', color);
        shape.style.fill = color;
        shape.setAttribute('opacity', opacity);
        shape.style.opacity = opacity;
      });
    }

    function updatePaletteBar() {
      const palette = getPalette();
      const bar = document.getElementById('palette-bar');
      bar.innerHTML = '';
      palette.forEach(color => {
        const swatch = document.createElement('div');
        swatch.classList.add('swatch');
        swatch.style.background = color;
        bar.appendChild(swatch);
      });
    }

    // Dynamically populate colormap dropdown with only chroma.js brewer scales
    function populateColormapDropdown() {
      const dropdown = document.getElementById('colormap');
      dropdown.innerHTML = '<option value="custom">Custom</option>';
      const brewerScales = Object.keys(chroma.brewer);
      brewerScales.forEach(scale => {
        const opt = document.createElement('option');
        opt.value = scale;
        opt.textContent = scale.charAt(0).toUpperCase() + scale.slice(1);
        dropdown.appendChild(opt);
      });
    }
    // Call on page load
    document.addEventListener('DOMContentLoaded', populateColormapDropdown);

    document.getElementById('svgFile').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        document.getElementById('svg-container').innerHTML = ev.target.result;
        svgDoc = document.getElementById('svg-container').querySelector('svg');
        // Set viewBox to fit all elements
        if (svgDoc && typeof svgDoc.getBBox === 'function') {
          try {
            const bbox = svgDoc.getBBox();
            svgDoc.setAttribute('viewBox', `${bbox.x} ${bbox.y} ${bbox.width} ${bbox.height}`);
          } catch (e) { }
        }
        document.getElementById('applyBtn').disabled = false;
        document.getElementById('downloadBtn').disabled = false;
        updatePaletteBar();
      };
      reader.readAsText(file);
    });

    document.getElementById('applyBtn').addEventListener('click', updateSVGColors);

    document.getElementById('downloadBtn').addEventListener('click', function () {
      if (!svgDoc) return;
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgDoc);
      // Add XML declaration if missing
      if (!source.startsWith('<?xml')) {
        source = '<?xml version="1.0" encoding="UTF-8"?>\n' + source;
      }
      const blob = new Blob([source], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'edited.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Update palette bar on color change
    document.getElementById('color1').addEventListener('input', updatePaletteBar);
    document.getElementById('color2').addEventListener('input', updatePaletteBar);
    document.getElementById('color3').addEventListener('input', updatePaletteBar);
    document.getElementById('randomness').addEventListener('input', function() {
      document.getElementById('randomnessValue').textContent = parseFloat(this.value).toFixed(2);
    });

    // Show/hide custom color pickers based on colormap
    document.getElementById('colormap').addEventListener('change', function() {
      document.getElementById('customColors').style.display = this.value === 'custom' ? '' : 'none';
      updatePaletteBar();
    });

    // Initialize palette bar on page load
    updatePaletteBar();
  </script>
</body>

</html>
