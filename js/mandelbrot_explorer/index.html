<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandelbrot & Julia Explorer</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <div class="panel">
      <h2>Fractal Explorer</h2>

      <div class="section">
        <label>Color Palette</label>
        <div id="palette-buttons" class="palette-grid">
          <button class="palette-btn active" data-palette="0"><span class="swatch swatch-classic"></span> Classic</button>
          <button class="palette-btn" data-palette="1"><span class="swatch swatch-fire"></span> Fire</button>
          <button class="palette-btn" data-palette="2"><span class="swatch swatch-rainbow"></span> Rainbow</button>
          <button class="palette-btn" data-palette="3"><span class="swatch swatch-neon"></span> Neon</button>
          <button class="palette-btn" data-palette="4"><span class="swatch swatch-ocean"></span> Ocean</button>
          <button class="palette-btn" data-palette="5"><span class="swatch swatch-gray"></span> Grayscale</button>
          <button class="palette-btn" data-palette="6"><span class="swatch swatch-pastel"></span> Pastel</button>
          <button class="palette-btn" data-palette="7"><span class="swatch swatch-custom"></span> Custom</button>
        </div>
      </div>

      <div id="custom-colors" class="section hidden">
        <label>Custom Colors</label>
        <div class="color-row">
          <input type="color" id="color1" value="#ff0000" />
          <input type="color" id="color2" value="#00ff00" />
          <input type="color" id="color3" value="#0000ff" />
        </div>
      </div>

      <div class="section">
        <label>Max Iterations <span id="iter-value">100</span></label>
        <input type="range" id="iter-slider" min="20" max="1000" value="100" step="1" />
      </div>

      <div class="section info">
        <div><span class="info-label">M Center:</span> <span id="info-center">-0.5 + 0.0i</span></div>
        <div><span class="info-label">M Zoom:</span> <span id="info-mzoom">1.0</span></div>
        <div><span class="info-label">J Center:</span> <span id="info-jcenter">0.0 + 0.0i</span></div>
        <div><span class="info-label">J Zoom:</span> <span id="info-jzoom">1.0</span></div>
        <div><span class="info-label">Julia C:</span> <span id="info-julia">—</span></div>
        <div><span class="info-label">Lock:</span> <span id="lock-text" style="color:#ff6b6b">unlocked</span></div>
      </div>

      <button id="reset-btn" class="reset-btn">Reset View</button>

      <div class="section" style="margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
        <label>Export 8K PNG</label>
        <div style="display:flex; gap:6px;">
          <button id="export-m-btn" class="export-btn">Mandelbrot</button>
          <button id="export-j-btn" class="export-btn">Julia Set</button>
        </div>
      </div>
    </div>
  </div>

  <div id="labels">
    <div id="label-m">Mandelbrot</div>
    <div id="label-j">Julia</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
