<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fractal Curves</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/chroma.min.js"></script>
  </head>

  <body>
    <div id="container">
      <div id="controls">
        <h1>Fractal Curves</h1>

        <div class="control-row">
          <div class="control-group">
            <label for="curveSelect">Curve</label>
            <select id="curveSelect">
              <optgroup label="Space-filling curves">
                <option value="hilbert">Hilbert</option>
                <option value="moore">Moore</option>
                <option value="peano">Peano</option>
                <option value="peano_alt">Peano (alt)</option>
                <option value="gosper">Gosper</option>
                <option value="gosper_island">Gosper island</option>
                <option value="sierpinski_curve">Sierpiński curve</option>
                <option value="terdragon">Terdragon</option>
              </optgroup>
              <optgroup label="Koch &amp; Cesàro">
                <option value="koch">Koch</option>
                <option value="koch_60">Koch curve 60°</option>
                <option value="koch_snowflake">Koch snowflake</option>
                <option value="koch_square">Koch square island</option>
                <option value="cesaro">Cesàro curve 85°</option>
                <option value="minkowski">Minkowski sausage</option>
                <option value="minkowski_island">Minkowski island</option>
              </optgroup>
              <optgroup label="Sierpiński">
                <option value="sierpinski">Sierpiński arrowhead</option>
                <option value="sierpinski_triangle">Sierpiński triangle</option>
              </optgroup>
              <optgroup label="Trees &amp; plants">
                <option value="tree">Fractal tree</option>
                <option value="plant">Fractal plant</option>
              </optgroup>
              <optgroup label="Dragon &amp; Lévy">
                <option value="dragon">Dragon</option>
                <option value="levy">Lévy C</option>
              </optgroup>
            </select>
          </div>

          <div class="control-group">
            <label for="iterSlider">Iterations</label>
            <input type="range" id="iterSlider" min="0" max="15" step="1" value="0">
            <span id="iterValue" class="value-label">0</span>
          </div>
        </div>

        <div class="control-row">
<div class="control-group">
            <label for="cmapSelect">Colormap</label>
            <select id="cmapSelect"></select>
          </div>

          <div class="control-group">
            <label for="lwSlider">Line width</label>
            <input type="range" id="lwSlider" min="0.5" max="12" step="0.1" value="2">
            <span id="lwValue" class="value-label">2.0</span>
            <label class="check-label"><input type="checkbox" id="autoWidth" checked>Auto</label>
          </div>

          <div class="control-group">
            <label class="check-label"><input type="checkbox" id="smoothCheck">Smooth corners</label>
          </div>
        </div>

        <div class="control-row" id="customRow" hidden>
          <div class="control-group">
            <label>Custom colors</label>
            <span id="customStops"></span>
            <button type="button" id="addStopBtn" class="mini" title="Add color">+</button>
          </div>
        </div>

        <div class="button-group">
          <button id="exportBtn">Export SVG</button>
          <span id="segInfo" class="info-label"></span>
        </div>
      </div>

      <div id="canvas-container"></div>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
